<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cavid | Cyber Finance Portfolio</title>

<style>

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: radial-gradient(circle at top, #0f0f0f, #000);

    color: white;

}

/* glow background */

body::before {

    content: "";

    position: fixed;

    width: 200%;

    height: 200%;

    top: -50%;

    left: -50%;

    background: radial-gradient(circle, rgba(0,255,200,0.08), transparent 40%);

    animation: spin 12s linear infinite;

    z-index: -1;

}

@keyframes spin {

    0% {transform: rotate(0deg);}

    100% {transform: rotate(360deg);}

}

header {

    text-align: center;

    padding: 60px 20px;

}

h1 {

    font-size: 44px;

}

.subtitle {

    color: #00ffcc;

}

.container {

    max-width: 1000px;

    margin: auto;

    padding: 20px;

}

.section {

    background: rgba(255,255,255,0.05);

    border: 1px solid #222;

    padding: 20px;

    margin: 20px 0;

    border-radius: 12px;

}

.section:hover {

    border-color: #00ffcc;

    transform: scale(1.01);

    transition: 0.3s;

}

h2 {

    color: #00ffcc;

}

input {

    padding: 8px;

    margin: 5px;

    border: none;

    border-radius: 6px;

}

button {

    padding: 10px;

    background: #00ffcc;

    border: none;

    cursor: pointer;

    margin-top: 10px;

}

.result {

    margin-top: 10px;

    color: #00ffcc;

}

.footer {

    text-align: center;

    color: #666;

    padding: 30px;

    font-size: 12px;

}

</style>

</head>

<body>

<header>

    <h1>Cavid</h1>

    <div class="subtitle">Cybersecurity & Finance Enthusiast</div>

    <p>SAT: 1450 | IELTS: 8.0</p>

</header>

<div class="container">

    <!-- ABOUT -->

    <div class="section">

        <h2>About Me</h2>

        <p>Student interested in cybersecurity, finance, and technology.</p>

    </div>

    <!-- FINANCE CALCULATOR -->

    <div class="section">

        <h2>Finance Calculator</h2>

        <input id="amount" placeholder="Initial amount ($)">

        <input id="rate" placeholder="Interest %">

        <input id="years" placeholder="Years">

        <br>

        <button onclick="calcFinance()">Calculate</button>

        <div class="result" id="financeResult"></div>

    </div>

    <!-- PASSWORD CHECKER -->

    <div class="section">

        <h2>Password Strength Checker</h2>

        <input id="password" type="password" placeholder="Enter password">

        <br>

        <button onclick="checkPassword()">Check</button>

        <div class="result" id="passResult"></div>

    </div>

</div>

<div class="footer">

    © 2026 Cavid | Cyber Finance Portfolio

</div>

<script>

/* FINANCE CALCULATOR */

function calcFinance() {

    let p = parseFloat(document.getElementById("amount").value);

    let r = parseFloat(document.getElementById("rate").value) / 100;

    let t = parseFloat(document.getElementById("years").value);

    if (isNaN(p) || isNaN(r) || isNaN(t)) {

        document.getElementById("financeResult").innerText = "Enter valid numbers";

        return;

    }

    let result = p * Math.pow((1 + r), t);

    document.getElementById("financeResult").innerText =

        "Future Value: $" + result.toFixed(2);

}

/* PASSWORD STRENGTH CHECKER */

function checkPassword() {

    let pass = document.getElementById("password").value;

    let strength = 0;

    if (pass.length >= 8) strength++;

    if (/[A-Z]/.test(pass)) strength++;

    if (/[0-9]/.test(pass)) strength++;

    if (/[^A-Za-z0-9]/.test(pass)) strength++;

    let msg = "";

    if (strength <= 1) msg = "Weak";

    else if (strength == 2) msg = "Medium";

    else if (strength == 3) msg = "Strong";

    else msg = "Very Strong";

    document.getElementById("passResult").innerText =

        "Strength: " + msg;

}

</script>

</body>

</html>
